# Publishes to npm and creates a GitHub Release when a v* tag is pushed.
#
# Required secret: NPM_TOKEN (npm access token with publish rights for
# opencode-idea-inbox). Add it under Settings → Secrets and variables → Actions.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - uses: oven-sh/setup-bun@v2

      - name: Test
        run: bun test

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            opencode v2 plugin API port. Requires opencode >= 2.0.20.

            - Server: `Plugin.define({ id, setup(ctx) })` entrypoint, tools via
              `ctx.tool.transform`, session settle via `ctx.event.subscribe`,
              `idea_start` uses `ctx.session.create` + `ctx.session.prompt`
            - Native `/idea` and `/ideas` slash commands registered via
              `ctx.command.transform` — no manual copying of command files
            - CLI/TUI: reactive `ctx.keymap.layer` (palette takeover hack and
              delete-mode removed), dialogs/toasts via `ctx.ui`, sidebar via
              `ctx.ui.slot({ append: "sidebar.content" })`, theme tokens from
              `ctx.theme`
            - Local-path installs: root `server.ts` / `index.ts` / `tui.ts`
              re-exports (v2.0.20 ignores package.json exports for local dirs)
            - Install with the v2 `plugins` key (single entry loads both server
              and TUI parts); see README for details
            - Test suite fully ported to the v2 API (`bun test`, 77 tests)
            - Store format unchanged — existing ideas.db data keeps working
